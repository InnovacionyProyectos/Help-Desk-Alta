<div class="tree-node" id="typification-{{ typification.id }}">
  <div class="tree-node__row">
    <span class="tree-node__label">
      {{ typification.name }}
      {% if typification.code %}<span class="badge-muted">{{ typification.code }}</span>{% endif %}
      <span class="badge-muted">{{ typification.default_priority }}</span>
      {% if not typification.is_active %}<span class="badge-muted">Inactiva</span>{% endif %}
    </span>
    <span class="tree-node__actions">
      <a class="link-btn" href="/admin/classification/typifications/{{ typification.id }}/edit">Editar</a>
      <button
        type="button"
        class="link-btn{% if typification.is_active %} link-btn--danger{% endif %}"
        hx-post="/admin/classification/typifications/{{ typification.id }}/toggle-active"
        hx-target="closest .tree-node"
        hx-swap="outerHTML"
      >{% if typification.is_active %}Desactivar{% else %}Activar{% endif %}</button>
    </span>
  </div>
</div>
