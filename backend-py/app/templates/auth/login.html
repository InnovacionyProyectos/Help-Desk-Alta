<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
    <link rel="stylesheet" href="/static/css/app.css" />
    <title>Alta · Help Desk</title>
  </head>
  <body>
    <div class="auth-screen">
      <div class="auth-card">
        <div class="auth-card__brand">
          <span class="auth-card__brand-mark">{% include "layout/_brand_mark.html" %}</span>
          <span class="auth-card__brand-sub">Help Desk</span>
        </div>
        <p class="auth-card__subtitle">Ingrese con su correo corporativo</p>

        {% if error %}
        <div class="auth-error">{{ error }}</div>
        {% endif %}

        <form method="post" action="/login" novalidate>
          <div class="form-field">
            <label for="email">Correo electrónico</label>
            <input class="input" type="email" id="email" name="email" value="{{ email or '' }}" required autocomplete="username" />
          </div>
          <div class="form-field">
            <label for="password">Contraseña</label>
            <input class="input" type="password" id="password" name="password" required autocomplete="current-password" />
          </div>
          <button class="btn btn--primary btn--full" type="submit">Iniciar sesión</button>
        </form>
      </div>
    </div>
  </body>
</html>
